[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-pc-windows-msvc", "x86_64-pc-windows-msvc", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# release.yml is hand-edited to use the latest actions/checkout (v7, Node 24);
# dist 0.34 still generates v6. Keep dist from overwriting or rejecting it.
allow-dirty = ["ci"]
# Whether to install an updater program
install-updater = false

# Build Windows arm64 natively: the default cross-compile container ships a
# rustc that is too old for some dependencies (hayro needs >= 1.92).
[dist.github-custom-runners]
aarch64-pc-windows-msvc = "windows-11-arm"
