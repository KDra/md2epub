[package]
name = "md2epub"
version = "0.1.3"
edition = "2024"
description = "Convert rich Markdown or HTML into reflowable EPUB 3 for handwriting on Kindle Scribe and reMarkable"
license = "MIT"
# Used by dist for release download URLs; change it if the GitHub repo lives elsewhere.
repository = "https://github.com/KDra/md2epub"
publish = false

[features]
default = ["math", "mermaid"]
# LaTeX math rendering: typst-based SVG math (T6). MathML works without it.
math = ["dep:mitex", "dep:mitex-spec-gen", "dep:typst", "dep:typst-layout", "dep:typst-svg"]
# Mermaid diagram rendering: in-process renderer (T7). Without it, only an
# `mmdc` found on PATH is used.
mermaid = ["dep:mermaid-rs-renderer"]

[dependencies]
# T0
anyhow = "1.0.105"
html5ever = "0.40.1"
markup5ever_rcdom = "0.40.1"
sha2 = "0.11.1"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# T1
clap = { version = "4.6.9", features = ["derive"] }
toml = "1.2.2"
serde_yaml = "0.9.34"
# T2
comrak = { version = "1.2.0", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
# T3
# T4
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
base64 = "0.23.1"
percent-encoding = "2.3.2"
flate2 = "1.1.11"
# T5
resvg = "0.50.0"
usvg = "0.50.0"
tiny-skia = "0.12.0"
# T6
pulldown-latex = "0.8.0"
mitex = { version = "0.2.4", optional = true }
# Use mitex's prebuilt command spec so its build script never shells out.
mitex-spec-gen = { version = "0.2.4", optional = true, features = ["prebuilt"] }
typst = { version = "0.15.1", optional = true }
typst-layout = { version = "0.15.1", optional = true }
typst-svg = { version = "0.15.1", optional = true }
# T7
mermaid-rs-renderer = { version = "0.3.1", default-features = false, optional = true }
# T8
# T9
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
# User defaults (`md2epub config`): config dir lookup and comment-preserving edits.
dirs = "7.0.0"
toml_edit = "0.25.20"
# Confluence export and publish (`--format confluence`, `md2epub publish`).
roxmltree = "0.21.2"
serde_json = "1.0.154"

[dev-dependencies]
# T0
tempfile = "3.27.0"
# T1
# T2
# T3
# T4
# T5
# T6
# T7
# T8
# T9
# T10

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' (cargo-dist) builds release artifacts with; see
# dist-workspace.toml for targets and installers.
[profile.dist]
inherits = "release"
lto = "thin"

# T10: `publish = false` keeps the crate off crates.io; this tells dist the
# binary is still meant for GitHub Releases.
[package.metadata.dist]
dist = true

# `mitex-spec-gen` is never named in code: it is a dependency only to turn on
# its `prebuilt` feature for mitex.
[lints.cargo]
unused_dependencies = "allow"
